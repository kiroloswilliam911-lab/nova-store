{% extends "base.html" %}

{% block title %}My Profile | NOVA STORE{% endblock %}

{% block content %}

<section class="auth-container">
    <div class="auth-card">
        <h1>My Profile</h1>

        <p><strong>Username:</strong> {{ current_user.username }}</p>
        <p><strong>Email:</strong> {{ current_user.email }}</p>

        <a href="{{ url_for('orders.my_orders') }}" class="btn">My Orders</a>
    </div>
</section>

{% endblock %}
